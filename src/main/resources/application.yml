# Variables
database-server: localhost
database-port: 1433
database-name: db_customer_desa
database-username: developer
database-password: 'D3v#123457'


# Application configuration
quarkus:
  http:
    root-path: /api/v1
    port: 8085

  datasource:
    devservices:
      enabled: false
    db-kind: mssql
    username: ${database-username}
    password: ${database-password}
    jdbc:
      url: jdbc:sqlserver://${database-server}:${database-port};databaseName=${database-name};encrypt=true;trustServerCertificate=true

  hibernate-orm:
    jdbc:
      timezone: 'America/Lima'
    schema-management:
      strategy: none
    log:
      sql: true
      format-sql: true

  log:
    level: INFO # Nivel global de logs (puede ser DEBUG, INFO, WARN, ERROR, etc.)

  smallrye-graphql:
    error-extension-fields: classification,exceptionDetails

mp:
  graphql:
    showErrorMessage: com.ironman.partyreference.application.exception.ApplicationException

party-reference:
  identification-types:
    - code: '1'
      name: Nationalregistrationidentificationnumber
    - code: '2'
      name: Identitycardnumber
    - code: '3'
      name: Passportnumber
    - code: '6'
      name: Registrationauthorityidentification

  party-types:
    - code: 'P'
      name: Person
    - code: 'O'
      name: Organisation